[project]
name = "strata"
version = "0.1.0"
description = "Semantic dashboard IDE for Python repos"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "jedi>=0.19",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "watchdog>=5.0",
]

[project.scripts]
strata = "strata.api:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
